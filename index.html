<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>婚宴座位查詢系統</title>
<style>
  /* 基礎重置與跨平台一致性設定 */
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    margin: 0;
    padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background-color: #f8fafc;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    color: #1e293b;
  }

  .container { 
    max-width: 600px; 
    margin: auto; 
    position: relative; 
    z-index: 10; 
    width: 100%;
  }

  /* 標題與資訊區 */
  .header-card {
    background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%);
    border-radius: 20px;
    padding: 18px 16px;
    box-shadow: 0 4px 20px rgba(244, 63, 94, 0.08);
    margin-bottom: 14px;
    border: 1px solid #fecdd3;
    text-align: center;
    width: 100%;
  }

  .header-title { 
    font-size: 22px; 
    font-weight: 800; 
    color: #9f1239; 
    margin: 0 0 4px 0; 
    letter-spacing: 1px;
  }
  
  .header-subtitle { 
    color: #e11d48; 
    font-size: 13px; 
    margin: 6px 0 0 0; 
    font-weight: 500; 
  }
  
  /* 搜尋框卡片 */
  .search-card {
    background: #ffffff;
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    margin-bottom: 14px;
    border: 1px solid #f1f5f9;
  }
  .search-box { 
    display: flex; 
    gap: 8px; 
  }
  .search-box input { 
    flex: 1; 
    padding: 12px 16px; 
    font-size: 15px; 
    border-radius: 14px; 
    border: 1.5px solid #e2e8f0; 
    outline: none; 
    background: #f8fafc; 
    -webkit-appearance: none; 
    color: #1e293b;
    transition: all 0.2s;
  }
  .search-box input:focus { 
    border-color: #f43f5e; 
    background: #fff; 
    box-shadow: 0 0 0 3px rgba(244,63,94,0.1); 
  }
  .search-box button { 
    padding: 0 20px; 
    font-size: 15px; 
    border: none; 
    border-radius: 14px; 
    background: #f43f5e; 
    color: #fff; 
    cursor: pointer; 
    font-weight: bold;
    touch-action: manipulation;
    box-shadow: 0 4px 12px rgba(244,63,94,0.25);
    transition: transform 0.1s;
  }
  .search-box button:active { 
    transform: scale(0.96); 
  }
  
  /* 搜尋結果列表 */
  .guest-list { 
    max-height: 200px; 
    overflow-y: auto; 
    border: 1px solid #f1f5f9; 
    background: #fff; 
    -webkit-overflow-scrolling: touch; 
    border-radius: 12px;
  }

  .guest-item { 
    padding: 12px 14px; 
    border-bottom: 1px solid #f8fafc; 
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    background: #fff; 
    cursor: pointer; 
    transition: background 0.15s;
  }
  .guest-item:hover { 
    background: #f8fafc; 
  }

  /* 宴會廳主卡片 */
  .card { 
    background: #ffffff; 
    border-radius: 20px; 
    padding: 16px 12px; 
    margin-bottom: 14px; 
    box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    border: 1px solid #f1f5f9;
    width: 100%;
  }

  /* 主舞台樣式 */
  .stage {
    background: radial-gradient(circle at 50% 30%, #ffe4e6 0%, #ffccd2 100%);
    color: #e11d48;
    text-align: center;
    padding: 8px 16px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 14px;
    letter-spacing: 3px;
    width: 100%;
    max-width: 260px;
    margin-left: auto;
    margin-right: auto;
    border: 0.5px solid #f43f5e;
    box-shadow: 0 4px 12px rgba(244, 63, 94, 0.15);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }

  .stage-dot {
    width: 5px;
    height: 5px;
    background-color: #f43f5e;
    border-radius: 50%;
  }

  /* 座位圖外框：強制滿版、絕對不允許橫向捲動 */
  .seating-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    overflow: hidden;
    padding: 4px 0;
  }

  .seating { 
    display: flex; 
    flex-direction: column; 
    width: 100%;
    max-width: 420px; /* 限制最大寬度，在大螢幕平板上也不會過開 */
    margin: 0 auto;
    gap: 5px; 
  }

  /* 核心：標準 7 欄網格排版，確保跨所有手機螢幕尺寸完全等比例、不跑版 */
  .row { 
    display: grid; 
    grid-template-columns: repeat(7, 1fr); 
    width: 100%; 
    gap: 4px; 
    align-items: center; 
    justify-items: center; 
  }

  /* 座位圓圈樣式：使用 aspect-ratio 確保完美正圓，大小隨螢幕自適應 */
  .table { 
    width: 100%;
    aspect-ratio: 1 / 1; 
    max-width: 46px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    border-radius: 50%; 
    border: 1.5px solid #e2e8f0; 
    background: #ffffff; 
    font-size: clamp(9px, 2.8vw, 12px); 
    font-weight: bold; 
    color: #475569; 
    text-align: center; 
    position: relative;
    transition: all 0.2s ease;
  }

  .table.main { 
    max-width: 52px; 
    border: 2px solid #ff607a;
    background: radial-gradient(circle at 60% 30%, #ffb6c1 0%, #ff6b81 100%);
    box-shadow: 0 3px 10px rgba(244, 63, 94, 0.35);
    color: #ffffff;
    font-size: clamp(10px, 3vw, 13px);
  }
  
  .table.vip { 
    max-width: 48px; 
    border: 2px solid #8b5cf6;
    background: radial-gradient(circle at 50% 30%, #d8b4fe 0%, #7c3aed 100%);
    box-shadow: 0 3px 10px rgba(139, 92, 246, 0.35);
    color: #ffffff;
    font-size: clamp(10px, 2.9vw, 12px);
  }

  /* 走道空格與隱藏空白定位格 */
  .table.aisle-space, .table.empty { 
    border: none; 
    background: transparent; 
    pointer-events: none; 
    box-shadow: none;
  }
  .table.empty {
    visibility: hidden;
  }

  /* 發光藍色高亮定位格：安全內縮與層級控制，絕對不會被卡片邊緣切邊 */
  .table.highlight { 
    background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%) !important; 
    color: white !important; 
    border-width: 2.5px !important;
    border-style: solid !important;
    border-color: #ffffff !important;
    transform: scale(1.06);
    box-shadow: 0 0 12px rgba(59, 130, 246, 0.8), 0 0 4px rgba(0, 0, 0, 0.2) !important; 
    z-index: 20; 
  }

  .badge { 
    padding: 3px 8px; 
    border-radius: 6px; 
    color: white; 
    font-size: 11px; 
    font-weight: bold; 
  }
  .badge.main { background: #f43f5e; }
  .badge.vip { background: #8b5cf6; }
  .badge.normal { background: #3b82f6; }

  .legend-box {
    display: flex; 
    justify-content: center; 
    gap: 10px; 
    margin-top: 14px; 
    font-size: 11px; 
    color: #64748b; 
    flex-wrap: wrap;
  }
  .legend-item { 
    display: flex; 
    align-items: center; 
    gap: 4px; 
    font-weight: 500; 
  }
  .legend-dot { 
    width: 10px; 
    height: 10px; 
    border-radius: 50%; 
  }

  footer {
    text-align: center; 
    font-size: 11px; 
    color: #94a3b8; 
    margin: 16px 0 8px;
  }
</style>
</head>
<body>

<div class="container">
  <!-- 上方標題與資訊區塊 -->
  <div class="header-card">
    <h1 class="header-title">駿葳 & 泯霏</h1>
    <div style="font-size: 15px; font-weight: 700; color: #881337; margin-top: 2px;">婚宴座位查詢系統</div>
    <div class="header-subtitle">歡迎蒞臨！請輸入您的姓名、或桌號</div>
  </div>

  <!-- 搜尋框卡片 -->
  <div class="search-card">
    <h3 style="margin:0 0 10px 0; font-size: 15px; color: #334155;">🔍 賓客座位查詢</h3>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="請輸入姓名、或桌號(如:05、主桌)" onkeypress="if(event.key==='Enter') searchGuest()" enterkeyhint="search">
      <button onclick="searchGuest()">查詢</button>
    </div>
    <div id="resultContainer" style="margin-top: 12px;"></div>
  </div>

  <!-- 宴會廳平面圖獨立區塊 -->
  <div class="card">
    <div style="margin-bottom: 12px;">
      <h3 style="margin:0; font-size: 15px; color: #334155; display: flex; align-items: center; gap: 6px;">🗺️ 宴會廳座位平面圖</h3>
    </div>

    <div class="stage">
      <span class="stage-dot"></span>
      主舞台
      <span class="stage-dot"></span>
    </div>

    <div class="seating-wrapper">
      <div class="seating" id="seatingLayout"></div>
    </div>
    
    <div class="legend-box">
      <div class="legend-item"><div class="legend-dot" style="background:#ff6b81;"></div>主桌</div>
      <div class="legend-item"><div class="legend-dot" style="background:#7c3aed;"></div>貴賓</div>
      <div class="legend-item"><div class="legend-dot" style="background:#fff; border:1.5px solid #cbd5e1;"></div>嘉賓</div>
      <div class="legend-item"><div class="legend-dot" style="background:#3b82f6;"></div>查詢定位</div>
    </div>
  </div>

  <footer>吸引力國際股份有限公司 活動用 · 座位查詢系統</footer>
</div>

<script>
let quests = [];

/* 標準 7 欄網格座位對應陣列（透過空字串 '' 確保所有裝置左右對稱與完美對齊） */
const seatingLayoutData = [
  ['', '貴賓A', '', '主桌', '', '貴賓B', ''],
  ['01', '02', '03', 'aisle', '04', '05', '06'],
  ['07', '08', '09', 'aisle', '10', '11', '12'],
  ['13', '14', '15', 'aisle', '16', '17', '18'],
  ['19', '20', '21', 'aisle', '22', '23', '24'],
  ['25', '26', '27', 'aisle', '28', '29', '30'],
  ['31', '32', '33', 'aisle', '34', '35', '36'],
  ['37', '38', '39', 'aisle', '40', '41', '42'],
  ['43', '44', '45', 'aisle', '46', '47', '48'],
  ['49', '50', '51', 'aisle', '52', '53', '54']
];

async function loadQuestData() {
  try {
    const response = await fetch('quests.csv'); 
    if (!response.ok) throw new Error();
    const csvText = await response.text();
    const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== "");
    quests = lines.slice(1).map(line => {
      const columns = line.split(',').map(c => c.trim());
      return { name: columns[0], table: columns[1], count: parseInt(columns[2]) || 1, note: columns[3] || '' };
    });
  } catch (err) {
    quests = [
      { name: "王小明", table: "05", count: 1, note: "素食" },
      { name: "張麗華", table: "主桌", count: 2, note: "" },
      { name: "李大同", table: "貴賓A", count: 1, note: "" },
      { name: "陳美麗", table: "貴賓B", count: 2, note: "" },
      { name: "測試一號", table: "01", count: 1, note: "" },
      { name: "測試九號", table: "09", count: 1, note: "" }
    ];
  }
}

function searchGuest() {
  let query = document.getElementById('searchInput').value.trim();
  if (!query) return;
  document.getElementById('searchInput').blur();
  
  let upperQuery = query.toUpperCase();

  const results = quests.filter(q => {
    let qName = q.name;
    let qTable = q.table.toUpperCase();

    let isNumericQuery = /^\d+$/.test(query);

    if (isNumericQuery) {
      let queryNum = parseInt(query, 10);
      let tableNum = parseInt(qTable, 10);
      return !isNaN(tableNum) && tableNum === queryNum;
    } else {
      let isNameMatch = qName.toUpperCase().includes(upperQuery);
      let isTableMatch = (qTable === upperQuery);
      return isNameMatch || isTableMatch;
    }
  });

  const container = document.getElementById('resultContainer');
  if (results.length === 0) {
    container.innerHTML = `<div style="text-align:center; color:#64748b; padding: 10px; font-size: 14px;">查無 "${query}" 的相關座位資訊</div>`;
    highlightTables([]);
  } else {
    container.innerHTML = `
      <div class="guest-list">
        ${results.map(q => {
          const badgeClass = q.table.includes('主桌') ? 'main' : (q.table.includes('貴賓') ? 'vip' : 'normal');
          return `<div class="guest-item" onclick="selectGuest('${q.name}')">
            <div><span style="font-weight:600; color:#1e293b; font-size: 14px;">${q.name}</span> <small style="color:#64748b;">(${q.count}位)</small></div>
            <span class="badge ${badgeClass}">${q.table}</span>
          </div>`;
        }).join('')}
      </div>`;
    highlightTables([...new Set(results.map(r => r.table))]);
  }
}

function selectGuest(name) {
  document.getElementById('searchInput').value = name;
  searchGuest();
}

function highlightTables(targetTables) {
  const seatingDiv = document.getElementById('seatingLayout');
  seatingDiv.innerHTML = '';
  
  seatingLayoutData.forEach(row => {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'row';
    
    row.forEach(tableId => {
      const div = document.createElement('div');
      
      if (tableId === '') {
        div.className = 'table empty';
      } else if (tableId === 'aisle') {
        div.className = 'table aisle-space';
      } else {
        let typeClass = '';
        if (tableId === '主桌') typeClass = ' main';
        else if (tableId.includes('貴賓')) typeClass = ' vip';
        
        div.className = 'table' + typeClass;
        div.textContent = tableId;
        
        let isMatched = targetTables.some(t => {
          if (/^\d+$/.test(t) && /^\d+$/.test(tableId)) {
            return parseInt(t, 10) === parseInt(tableId, 10);
          }
          return t.toUpperCase() === tableId.toUpperCase();
        });

        if (isMatched) {
          div.classList.add('highlight');
        }
      }
      rowDiv.appendChild(div);
    });
    seatingDiv.appendChild(rowDiv);
  });
}

loadQuestData();
highlightTables([]);
</script>
</body>
</html>
